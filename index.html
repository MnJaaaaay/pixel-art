<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>像素绘图 · MVP</title>
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <header class="topbar">
    <div class="group">
      <button id="btn-new" title="清空所有画布">新建</button>
      <button id="btn-import" title="导入 JSON">导入</button>
      <button id="btn-save" title="保存为 JSON">保存</button>
    </div>
    <div class="group">
      <button id="btn-undo" title="撤销 (Ctrl+Z)">↶</button>
      <button id="btn-redo" title="重做 (Ctrl+Shift+Z)">↷</button>
    </div>
    <div class="group">
      <button id="btn-add-canvas" title="添加一张新画布">+ 画布</button>
      <button id="btn-remove-canvas" title="删除当前画布">− 画布</button>
      <label>新画布尺寸
        <select id="size-select">
          <option value="16">16×16</option>
          <option value="32" selected>32×32</option>
          <option value="48">48×48</option>
          <option value="64">64×64</option>
        </select>
      </label>
    </div>
    <div class="group">
      <button id="btn-zoom-out" title="缩小 (滚轮↓)">−</button>
      <button id="btn-zoom-reset" title="100% (按 0)"><span id="zoom-display">100%</span></button>
      <button id="btn-zoom-in" title="放大 (滚轮↑)">+</button>
    </div>
    <div class="group spacer">
      <span class="counter">画布 <strong id="count-canvases">1</strong> · 已用 <strong id="count-used">0</strong> 个</span>
    </div>
  </header>

  <main class="layout">
    <aside class="sidebar">
      <section>
        <h3>素材库</h3>
        <div id="palette" class="palette-grid"></div>
        <button id="btn-add-block" class="btn-block-add">+ 新建像素块</button>
        <form id="block-form" class="block-form" hidden>
          <label>颜色<input type="color" id="block-color" value="#ff5252"></label>
          <label>字符<input type="text" id="block-char" maxlength="4" placeholder="如 🚲 或 A" required></label>
          <label>名称<input type="text" id="block-name" maxlength="8" placeholder="可选"></label>
          <div class="form-actions">
            <button type="button" id="block-form-cancel">取消</button>
            <button type="submit">确认</button>
          </div>
        </form>
      </section>

      <section>
        <h3>工具</h3>
        <div class="tool-group">
          <button class="tool-btn active" data-tool="draw" title="画笔 (B)">✏️ 画笔</button>
          <button class="tool-btn" data-tool="erase" title="橡皮擦 (E)">🧹 橡皮擦</button>
          <button class="tool-btn" data-tool="move" title="移动画布 (M)">✋ 移动画布</button>
        </div>
        <p class="hint">
          单击 / 拖动作画；<br>
          按住 <kbd>Shift</kbd> 拖动 = 矩形批量；<br>
          切到 ✋ 拖动整张画布定位；<br>
          按住 <kbd>Space</kbd> 拖动 = 平移视图；<br>
          滚轮 = 缩放 (10%~300%)。
        </p>
      </section>
    </aside>

    <section class="workspace" id="workspace">
      <div class="canvas-outer" id="canvas-outer">
        <div class="canvas-area" id="canvas-area"></div>
      </div>
    </section>
  </main>

  <input type="file" id="file-input" accept=".json,application/json" hidden>
  <script src="./app.js"></script>
</body>
</html>
